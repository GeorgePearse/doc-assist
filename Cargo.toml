[package]
name = "doc-assist"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["George Pearse"]
description = "Automatic documentation generator for codebases using LLM"
license = "MIT"
repository = "https://github.com/georgepearse/doc-assist"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"  # Progress bars
colored = "2.1"     # Colored terminal output

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# LLM integration
litellm-rs = "0.1.3"  # Multi-provider LLM client that works with OpenAI, Anthropic, etc.

# AST parsing
syn = { version = "2.0", features = ["full", "extra-traits", "parsing"] }
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# File system
walkdir = "2.5"
ignore = "0.4"  # Respect .gitignore
glob = "0.3"

# Text processing
regex = "1.10"
pulldown-cmark = "0.12"  # Markdown parsing
pulldown-cmark-to-cmark = "19.0"  # Markdown writing

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
sha2 = "0.10"  # Content hashing
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"  # Home directory
once_cell = "1.19"  # Lazy statics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Rate limiting
governor = "0.7"
nonzero_ext = "0.3"

# Testing
[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
insta = "1.40"  # Snapshot testing
pretty_assertions = "1.4"

[[bin]]
name = "docassist"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true